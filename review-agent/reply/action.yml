name: RepoQL review — reply
description: >
  Start a review when a person replies in a thread the reviewer opened as a
  decision, so their answer is applied. Any other reply starts nothing. Needs
  only pull-requests read and actions write; run it on a hosted runner, outside
  the review's concurrency group, so a reply never cancels a review in flight.

inputs:
  workflow:
    description: The review workflow's file name, which must accept a `pr` workflow_dispatch input.
    required: true
  ref:
    description: The branch to run the review workflow from.
    default: ${{ github.event.repository.default_branch }}
  token:
    description: A token with pull-requests read and actions write.
    default: ${{ github.token }}

outputs:
  started:
    description: true when the reply was an answer and a review was started.

runs:
  using: node24
  main: main.js
