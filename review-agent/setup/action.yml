name: RepoQL review — setup
description: >
  Resolve the pull request, check out its head with full history, install rql,
  and serve the checkout until semantic search is ready, so a reviewer can use
  RepoQL from its first call. After the job, stop the host and keep the index.

inputs:
  pr:
    description: The pull request to review. Defaults to the one the event is about.
    default: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
  fresh:
    description: Review with a new session, with no memory of the earlier reviews. A `<command> fresh` comment also asks for one.
    default: 'false'
  command:
    description: The comment that asks for a review. Only used to read `<command> fresh`.
    default: /review
  path:
    description: Where the pull request is checked out, relative to the workspace. The review action reviews there too.
    default: '.'
  checkout:
    description: >
      Check the pull request's head out at path, with every branch and the
      whole history. Set false to check it out yourself (with submodules, LFS,
      or steps of your own before serving); the head must then be at path,
      with full history.
    default: 'true'
  rql:
    description: An rql binary to serve the checkout with, such as one a step before built. Empty installs the released rql.
    default: ''
  rql-label:
    description: How the review names the rql it stood on, such as "built from this PR". Defaults to its version.
    default: ''
  observe:
    description: >
      Serve the checkout under a second rql host that collects its telemetry,
      and require that this job's host served the reviewer's RepoQL calls.
      The review action reads the telemetry; REVIEW_OBSERVER names the
      observer's workspace for steps of your own.
    default: 'false'
  rql-version:
    description: The rql release to install, such as 1.14.2. Defaults to the latest. An rql already on PATH is used as it is.
    default: ''
  cache-index:
    description: Keep the RepoQL index between runs in the Actions cache, so a review does not index cold.
    default: 'true'
  ready-timeout-minutes:
    description: How long to wait for semantic search to become ready.
    default: '30'
  token:
    description: The token that reads the pull request and checks it out. The rql host clones imports with it.
    default: ${{ github.token }}

outputs:
  pr:
    description: The pull request number.
  head-sha:
    description: The head commit under review.
  base-ref:
    description: The branch the pull request merges into.
  rql:
    description: The rql binary that serves the checkout.

runs:
  using: node24
  main: main.js
  post: post.js
  post-if: always()
